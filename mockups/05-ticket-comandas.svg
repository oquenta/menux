  <!-- note bottom -->
  <text x="60" y="812" fill="#7A8394" font-family="Segoe UI" font-size="12.5">Solo se imprimen comandas de categorías con ítems pendientes (sentToKitchen=false). Rango: reimpresión no duplica (Art. II). Papel: rollo 80mm vía CSS @page.</text>
  <text x="60" y="834" fill="#9AA1AF" font-family="Segoe UI" font-size="12">El cajero también puede regenerar el ticket desde la historia “Pagados → Reimprimir”.</text>
