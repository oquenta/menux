<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Arial">
  <defs>
    <pattern id="qrc" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff"/>
      <rect x="0" y="0" width="5" height="5" fill="#26301B"/>
      <rect x="5" y="5" width="5" height="5" fill="#26301B"/>
      <rect x="5" y="0" width="2" height="2" fill="#26301B"/>
    </pattern>
  </defs>
  <rect width="1280" height="900" fill="#EDE7DE"/>
  <text x="60" y="70" fill="#26303F" font-size="26" font-weight="800">Experiencia del cliente — menú por QR de mesa</text>
  <text x="60" y="98" fill="#7A8394" font-size="15">El cliente escanea el QR de su mesa (codifica restaurante + mesa) y ordena sin instalar nada.</text>

  <!-- QR de mesa (left) -->
  <rect x="70" y="140" width="260" height="330" rx="16" fill="#fff" stroke="#D8D1C6"/>
  <text x="90" y="174" fill="#26303F" font-size="14" font-weight="700">QR de mesa · mesa 8</text>
  <rect x="90" y="192" width="220" height="220" rx="8" fill="url(#qrc)" stroke="#D8D1C6"/>
  <text x="90" y="438" fill="#7A8394" font-size="12">restosuite.com/m/la-paila/8?tok=…</text>
  <text x="90" y="458" fill="#26303F" font-size="13" font-weight="600">Codifica: tenant + mesa + token (R4)</text>
  <rect x="100" y="296" width="200" height="36" rx="18" fill="#8C2B2B"/>
  <text x="136" y="320" fill="#fff" font-size="13" font-weight="700">MESA 8 · La Paila</text>

  <!-- Phone : menu -->
  <rect x="380" y="140" width="390" height="740" rx="38" fill="#26301B"/>
  <rect x="394" y="154" width="362" height="712" rx="28" fill="#FFF8F0"/>
  <rect x="522" y="162" width="106" height="20" rx="10" fill="#26301B"/>
  <!-- app header -->
  <circle cx="432" cy="226" r="24" fill="#8C2B2B"/>
  <text x="424" y="233" fill="#fff" font-size="16">🍲</text>
  <text x="468" y="226" fill="#26303F" font-size="17" font-weight="800">La Paila</text>
  <text x="468" y="244" fill="#A9705B" font-size="10.5" font-weight="600">PICANTERÍA CRIOLLA</text>
  <rect x="618" y="212" width="122" height="34" rx="17" fill="#FCEBD3"/>
  <text x="630" y="234" fill="#8C5A2B" font-size="11" font-weight="700">Tu pedido · 2 items 🧺</text>
  <line x1="410" y1="262" x2="740" y2="262" stroke="#F1E5D6"/>
  <!-- cat chips -->
  <g>
    <rect x="410" y="276" width="52" height="30" rx="15" fill="#8C2B2B"/>
    <text x="424" y="296" fill="#fff" font-size="11.5" font-weight="700">Todo</text>
    <rect x="470" y="276" width="62" height="30" rx="15" fill="#fff" stroke="#EAD9C7"/>
    <text x="484" y="296" fill="#8C5A2B" font-size="11.5">Platos</text>
    <rect x="540" y="276" width="66" height="30" rx="15" fill="#fff" stroke="#EAD9C7"/>
    <text x="554" y="296" fill="#8C5A2B" font-size="11.5">Bebidas</text>
    <rect x="614" y="276" width="64" height="30" rx="15" fill="#fff" stroke="#EAD9C7"/>
    <text x="628" y="296" fill="#8C5A2B" font-size="11.5">Postres</text>
  </g>
  <text x="410" y="336" fill="#8C5A2B" font-size="15" font-weight="800">🍴 Platos</text>
  <rect x="486" y="322" width="74" height="18" rx="9" fill="#FCEBD3"/>
  <text x="494" y="335" fill="#8C5A2B" font-size="10">8 opciones</text>
  <!-- product card 1 with stepper -->
  <rect x="410" y="348" width="330" height="118" rx="14" fill="#fff" stroke="#F1E5D6"/>
  <rect x="422" y="362" width="52" height="52" rx="12" fill="#FFF3E0"/>
  <text x="434" y="398" font-size="24">🍽️</text>
  <text x="486" y="382" fill="#26303F" font-size="12.5" font-weight="700">Silpancho a la Chuqui…</text>
  <text x="486" y="398" fill="#A9705B" font-size="10">Milanesa de res, arroz, papas…</text>
  <text x="486" y="448" fill="#B4452F" font-size="14" font-weight="800">Bs 38,00</text>
  <rect x="650" y="384" width="76" height="30" rx="15" fill="#fff" stroke="#EAD9C7"/>
  <text x="660" y="404" fill="#B4452F" font-size="14" font-weight="700">−</text>
  <text x="680" y="404" fill="#26301B" font-size="13" font-weight="700">1</text>
  <text x="700" y="404" fill="#8C2B2B" font-size="14" font-weight="800">＋</text>
  <!-- product card 2 -->
  <rect x="410" y="478" width="330" height="118" rx="14" fill="#fff" stroke="#F1E5D6"/>
  <rect x="422" y="492" width="52" height="52" rx="12" fill="#FDEEEE"/>
  <text x="434" y="528" font-size="24">🍟</text>
  <text x="486" y="512" fill="#26303F" font-size="12.5" font-weight="700">Pique Macho (2 pers.)</text>
  <text x="486" y="528" fill="#A9705B" font-size="10">Res, chorizos, papas, locoto…</text>
  <text x="486" y="578" fill="#B4452F" font-size="14" font-weight="800">Bs 68,00</text>
  <rect x="650" y="514" width="76" height="30" rx="15" fill="#fff" stroke="#EAD9C7"/>
  <text x="660" y="534" fill="#B4452F" font-size="14" font-weight="700">−</text>
  <text x="680" y="534" fill="#26301B" font-size="13" font-weight="700">1</text>
  <text x="700" y="534" fill="#8C2B2B" font-size="14" font-weight="800">＋</text>
  <!-- product card 3 (agotado) -->
  <rect x="410" y="608" width="330" height="108" rx="14" fill="#F8F1E9" stroke="#F1E5D6" opacity="0.85"/>
  <rect x="422" y="622" width="52" height="52" rx="12" fill="#EFEAE2"/>
  <text x="434" y="658" font-size="24" opacity="0.4">🥩</text>
  <text x="486" y="642" fill="#8B8579" font-size="12.5" font-weight="700">Sopa de Maní</text>
  <text x="486" y="658" fill="#A29A8C" font-size="10">Clásica sopa paceña con…</text>
  <rect x="620" y="630" width="106" height="26" rx="13" fill="#EADFD2"/>
  <text x="632" y="647" fill="#8B8579" font-size="11" font-weight="700">🚫 Agotado (R10)</text>
  <text x="486" y="690" fill="#B19C84" font-size="12" font-weight="700">Bs 22,00</text>
  <!-- bottom cart bar -->
  <rect x="394" y="800" width="362" height="66" rx="0" fill="#8C2B2B"/>
  <rect x="410" y="814" width="330" height="40" rx="20" fill="#7A2119"/>
  <text x="432" y="840" fill="#fff" font-size="12.5" font-weight="600">🛒 Ver pedido · 2 platos</text>
  <text x="662" y="840" fill="#fff" font-size="13" font-weight="800" text-anchor="end">Bs 106,00</text>

  <!-- Phone : confirmación pedido (middle-right phone) -->
  <rect x="840" y="140" width="360" height="740" rx="38" fill="#26301B"/>
  <rect x="854" y="154" width="332" height="712" rx="28" fill="#FFF8F0"/>
  <rect x="966" y="162" width="106" height="20" rx="10" fill="#26301B"/>
  <rect x="854" y="154" width="332" height="120" rx="28" fill="#1E6B4F"/>
  <rect x="854" y="260" width="332" height="26" fill="#1E6B4F"/>
  <circle cx="1020" cy="200" r="16" fill="#fff"/>
  <text x="1013" y="206" fill="#1E6B4F" font-size="14" font-weight="800">✓</text>
  <text x="940" y="240" fill="#fff" font-size="16" font-weight="800">¡Tu pedido ya está en caja!</text>
  <text x="880" y="262" fill="#CBE7DC" font-size="9.5">Acércate a la caja y menciona tu alias para realizar el pago.</text>
  <text x="1020" y="322" fill="#8C5A2B" font-size="10" font-weight="700" text-anchor="middle">TU NÚMERO DE PEDIDO</text>
  <text x="1020" y="356" fill="#8C2B2B" font-size="36" font-weight="800" text-anchor="middle">VK3MD</text>
  <text x="1020" y="378" fill="#7A8394" font-size="10" text-anchor="middle">Alias: <tspan fill="#26301B" font-weight="700">oscar</tspan> · mesa 8</text>
  <rect x="930" y="392" width="180" height="26" rx="13" fill="#FCEBD3"/>
  <text x="960" y="409" fill="#8C5A2B" font-size="10.5" font-weight="600">⏱ Expira en 24:16</text>
  <rect x="874" y="432" width="292" height="64" rx="12" fill="#F6EFDF"/>
  <text x="1020" y="456" fill="#8C5A2B" font-size="9.5" font-weight="700" text-anchor="middle">TOTAL A CANCELAR EN CAJA</text>
  <text x="1020" y="482" fill="#8C2B2B" font-size="20" font-weight="800" text-anchor="middle">Bs 106,00</text>
  <rect x="874" y="512" width="292" height="122" rx="12" fill="#fff" stroke="#F1E5D6"/>
  <text x="888" y="536" fill="#A9705B" font-size="10">Hora de envío</text><text x="1020" y="536" fill="#26301B" font-size="10.5" font-weight="600">01:14 a.m. · hoy</text>
  <text x="888" y="556" fill="#A9705B" font-size="10">Celular</text><text x="1020" y="556" fill="#26301B" font-size="10.5" font-weight="600">71572401</text>
  <line x1="888" y1="568" x2="1152" y2="568" stroke="#F1E5D6"/>
  <text x="888" y="588" fill="#8C5A2B" font-size="10" font-weight="700">DETALLE</text>
  <text x="888" y="608" fill="#26301B" font-size="10.5">1× Silpancho Chuquisaqueño</text><text x="1152" y="608" fill="#26301B" font-size="10.5" text-anchor="end">Bs 38.00</text>
  <text x="888" y="626" fill="#26301B" font-size="10.5">1× Pique Macho (2 pers.)</text><text x="1152" y="626" fill="#26301B" font-size="10.5" text-anchor="end">Bs 68.00</text>
  <text x="1020" y="676" fill="#A9705B" font-size="9" text-anchor="middle">Esta pantalla se actualiza cada pocos segundos (polling 5s)</text>
  <rect x="874" y="700" width="292" height="36" rx="8" fill="#FDF3E4" stroke="#E7B75F"/>
  <text x="1020" y="723" fill="#9A6B1F" font-size="10" text-anchor="middle" font-weight="600">Cuando la caja confirme, verás “✔ Pagado — ¡Gracias!”</text>

  <!-- notes -->
  <text x="60" y="880" fill="#7A8394" font-size="12">Reglas activas en esta vista: exclusividad de pedido abierto (R5) · TTL 30 min con cuenta atrás (R6) · snapshot de precio (Art. III) · alias + celular en envío (R4).</text>
</svg>
