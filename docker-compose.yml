services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-resto}:${POSTGRES_PASSWORD:-resto}@db:5432/${POSTGRES_DB:-resto}?schema=public
      - APP_SECRET=${APP_SECRET:-restosuite-secret-key-coolify-change-me}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resto}
      POSTGRES_DB: ${POSTGRES_DB:-resto}
    expose:
      - "5432"
    volumes:
      - resto-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resto}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resto-data:
